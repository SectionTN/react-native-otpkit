name: Lowest React Native
on:
  push:
    branches:
      - main
    paths:
      - android/**
      - src/**
      - package.json
      - .github/workflows/floor.yml
  pull_request:
    branches:
      - main
    paths:
      - android/**
      - src/**
      - package.json
      - .github/workflows/floor.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android, ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lowest React Native
            rn: floor
          - label: latest React Native
            rn: latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: "17"

      - name: Pack the library
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create an app on the lowest React Native the peer range allows
        if: matrix.rn == 'floor'
        run: |
          floor=$(node -p "require('./package.json').peerDependencies['react-native'].match(/\d+\.\d+/)[0]")
          version=$(npm view "react-native@~$floor.0" version --json | jq -r 'if type == "array" then last else . end')
          echo "React Native $version"
          npx --yes @react-native-community/cli@20.2.0 init OTPKitFloor --version "$version" --pm npm --skip-git-init --install-pods false --directory "$RUNNER_TEMP/app"

      - name: Create an app on the latest React Native
        if: matrix.rn == 'latest'
        run: |
          version=$(npm view react-native@latest version)
          echo "React Native $version"
          npx --yes @react-native-community/cli@latest init OTPKitFloor --version "$version" --pm npm --skip-git-init --install-pods false --directory "$RUNNER_TEMP/app"

      - name: Install the packed library
        working-directory: ${{ runner.temp }}/app
        run: |
          npm install "$RUNNER_TEMP"/react-native-otpkit-*.tgz
          printf '%s\n' "import { OTPField } from 'react-native-otpkit';" "" "export default function App() {" "  return <OTPField />;" "}" > App.tsx

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-floor-${{ matrix.rn }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-floor-${{ matrix.rn }}-

      - name: Build the release app
        working-directory: ${{ runner.temp }}/app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
